# What a caller is told when something goes wrong: the status, and nothing else. A stack
# trace names the classes and the libraries and their versions, which is a map for
# somebody deciding what to try next.
server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
  max-http-request-header-size: 8KB

spring:
  application:
    name: municipality-agent

  lifecycle:
    # Long enough to finish the turns already in flight, short enough that a rolling
    # deploy is not waiting on this.
    timeout-per-shutdown-phase: 20s

  # Embedded and in memory unless a URL says otherwise, so the thing starts with nothing
  # configured. Point DB_URL at Postgres and the same schema is built there.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: agent-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is allowed to check it and nothing else: a
      # schema that drifts should stop the service, not be quietly patched under it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      # No model is built unless one is asked for. The suite runs and the console runs
      # with no API key and no network: the keyword stand-in classifies instead, and
      # says so at startup. The profile below is what turns the real one on.
      chat: none

# What a model costs, per million tokens, keyed by the model id the provider reports on
# its own response -- not the one that was asked for, because those differ the moment a
# provider aliases a name to a dated version.
#
# These are a starting point, not a quote. Prices change without asking anybody here, and
# a model with no price is counted as costing nothing, said so in the log, and counted in
# the agent.model.calls{priced=false} metric.
# Health and probes for whatever is running this, metrics for whatever is scraping it,
# and traces only when somebody has said where to send them -- an exporter shouting at a
# collector that is not there is noise in every log for no benefit.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Ready means able to answer, which needs the database. Alive means the process is
        # not wedged, and a database that went away is not a reason to restart the process.
        readiness:
          include: readinessState,db
  server:
    port: ${MANAGEMENT_PORT:8080}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTLP_ENABLED:false}
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

agent:
  api:
    # The shared secret a caller sends in X-Api-Key. Required: with nothing here the
    # service refuses to start. The profiles below turn on the local mode that makes one
    # up instead, which prints it into whatever is reading the log.
    key: ${API_KEY:}
    allow-generated-key: ${ALLOW_GENERATED_KEY:false}
    messages-per-window: ${RATE_LIMIT:20}
    window: 1m

  # Set this and a resident reads as the same pseudonym across restarts and instances.
  # Leave it and one is generated per run: safe, and useless for anything older than
  # the run it came from.
  pseudonym-secret: ${PSEUDONYM_SECRET:}

  pricing:
    currency: USD
    models:
      claude-haiku-4-5:
        input-per-million: 1.00
        output-per-million: 5.00
      claude-haiku-4-5-20251001:
        input-per-million: 1.00
        output-per-million: 5.00

---

# The REPL prints its own trace under every answer, so the log has nothing to add and
# would only interleave itself with the prompt.
spring:
  config:
    activate:
      on-profile: console

logging:
  level:
    root: warn

agent:
  api:
    # Nobody is posting to an endpoint in a terminal session.
    allow-generated-key: true

---

# The suite. Not production, and allowed to say so in one place rather than in every test
# that happens to start a context.
spring:
  config:
    activate:
      on-profile: test

agent:
  api:
    allow-generated-key: true

---

spring:
  config:
    activate:
      on-profile: ai

  ai:
    model:
      chat: anthropic
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Routing is a lookup, not a piece of writing. The same message should come
          # back with the same answer every time.
          temperature: 0.0
