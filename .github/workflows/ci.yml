# What every change is put through before anybody looks at it.
#
# Nothing here needs configuring. There are no secrets, no variables and no accounts: a
# fork gets the same green tick as the original, and a contributor's first pull request
# does not fail on something they were never given.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. There is nothing to learn from a run against a
# commit nobody is going to merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:

  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # verify, not test: this is where the coverage gate and the module boundaries are.
      - name: Build, test and enforce coverage
        run: ./mvnw ${MAVEN_ARGS} verify

      - name: Check the transcripts were not left stale
        run: |
          ./mvnw ${MAVEN_ARGS} test -Dtest=GoldenConversationTest -Dgolden.update=true
          if ! git diff --quiet -- src/test/resources/golden; then
            echo "::error::The conversation transcripts do not match what the agent does."
            echo "Run 'make golden', read the diff, and commit it if the change was meant."
            git --no-pager diff -- src/test/resources/golden
            exit 1
          fi

      # Kept whether or not the build passed: the report of a failing build is the one
      # somebody actually wants to read.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Say what the coverage was
        if: always()
        run: |
          test -f target/site/jacoco/jacoco.csv || exit 0
          awk -F, 'NR > 1 {
              missed += $8; covered += $9
          } END {
              printf "### Coverage\n\n**%.2f%%** of lines (%d of %d)\n", \
                  covered / (covered + missed) * 100, covered, covered + missed
          }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

  image:
    name: build the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. Whether the image can be built is a question about this
      # change; whether it should be published is a question about a release.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: municipality-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers
        run: |
          docker run -d --name agent -p 8080:8080 -e API_KEY=ci-key \
            municipality-agent:${{ github.sha }}

          for attempt in $(seq 30); do
            if curl -fsS localhost:8080/actuator/health/readiness | grep -q UP; then
              ready=yes
              break
            fi
            sleep 2
          done

          if [ "${ready:-no}" != yes ]; then
            echo "::error::The container never became ready."
            docker logs agent
            exit 1
          fi

          reply=$(curl -fsS localhost:8080/api/v1/messages \
            -H 'X-Api-Key: ci-key' -H 'Content-Type: application/json' \
            -d '{"from":"+5493415551234","contents":[{"type":"text","body":"quiero sacar la licencia"}]}')

          echo "$reply"
          echo "$reply" | grep -q DNI || { echo "::error::The image answered, but not with what it should."; exit 1; }

      - name: Show the log if that went badly
        if: failure()
        run: docker logs agent || true
