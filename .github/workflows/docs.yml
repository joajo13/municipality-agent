# The documentation exists in two languages, and the Spanish half is only useful if it is
# still true. Nothing here needs configuring: the check is a hash comparison, with no
# network and no key.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  translations:
    name: the Spanish half still describes this code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Every translation is current
        run: scripts/translations check

  links:
    name: the links go somewhere
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # Relative links only. A link to a file that was renamed is a broken promise in the
      # one place people go when they are already lost; a link to somebody else's website
      # is their problem and their uptime.
      - name: No link points at a file that is not there
        run: |
          broken=0

          while read -r file; do
            grep -oE '\]\(([^)#]+)(#[^)]*)?\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:)' \
              | while read -r target; do
                  [ -z "$target" ] && continue
                  resolved="$(dirname "$file")/$target"
                  if [ ! -e "$resolved" ]; then
                    echo "::error file=$file::links to $target, which is not there"
                    exit 1
                  fi
                done || broken=1
          done < <(find . -name '*.md' -not -path './target/*' -not -path './.git/*')

          exit "$broken"
